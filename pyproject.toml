[project]
name = "Collective-Modding-Toolkit"
authors = [{ name = "wxMichael" }]
license = "GPL-2.0-or-later"
description = "A toolkit for troubleshooting and optimizing your mod setup for Fallout 4, purpose-built for the Collective Modding Discord Community."
version = "0.6.3"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "chardet",
    "packaging",
    "pillow",
    "psutil",
    "pywin32",
    "pywin32-ctypes",
    "pyxdelta",
    "requests",
    "sv-ttk>=2.6.1",
    "tkinter-tooltip",
]

[project.urls]
homepage = "https://www.nexusmods.com/fallout4/mods/87907"
repository = "https://github.com/wxMichael/Collective-Modding-Toolkit"
issues = "https://github.com/wxMichael/Collective-Modding-Toolkit/issues"
changelog = "https://github.com/wxMichael/Collective-Modding-Toolkit/blob/main/CHANGELOG.md"
download = "https://github.com/wxMichael/Collective-Modding-Toolkit/releases/latest/download/cm-toolkit.zip"

[tool.uv]
required-version = ">=0.13.7"

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "setuptools",
    "ty>=0.0.99",
    "types-psutil>=7.2.2.20260906",
    "types-pywin32>=312.0.0.20261104",
]

[tool.uv.sources]
pyxdelta = { git = "https://github.com/Illidanz/pyxdelta" }

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
exclude = [".pytest_cache"]

[tool.ruff]
line-length = 130

[tool.ruff.format]
preview = true
indent-style = "tab"

[tool.ruff.lint.pylint]
max-bool-expr = 10
max-returns = 10

[tool.ruff.lint]
preview = true
extend-select = [
	"A",     # Builtin Shadowing
	"ANN",   # Type Annotations
	"ARG",   # Unused Arguments
	"ASYNC", # Async Suggestions
	"B",     # Bugs/Design Problems
	"BLE",   # Blind Except
	"C4",    # Comprehensions
	# "C901",  # Complex Structures
	"COM", # Commas
	# "D",     # pydocstyle
	# "DTZ",   # Unsafe/Naive Datetimes
	"EM",   # Exception Messages
	"FA",   # Future Annotations
	"FBT",  # Boolean Traps
	"FLY",  # F-Strings
	"FURB", # Modernization
	"G",    # Logging Formatting
	"I",    # Import Sorting
	"ICN",  # Import Naming Conventions
	"INT",  # gettext
	"ISC",  # Implicit String Concatenation
	"LOG",  # Logging
	"N",    # PEP8 Naming Conventions
	"PERF", # Performance Anti-Patterns
	"PGH",  # PyGrep Hooks
	"PIE",  # Misc Lints
	"PL",   # Pylint
	"PT",   # PyTest
	"PTH",  # Prefer Pathlib
	"PYI",  # Stub Files
	"Q",    # Quotes
	"RET",  # Return
	"RSE",  # Raise
	"RUF",  # Ruff
	# "S",     # Security Testing
	"SIM", # Simplify
	"SLF", # Self
	# "T20",   # print
	"TC",  # Type Checking
	"TID", # Tidy Imports
	"TRY", # Exception Anti-Patterns
	"UP",  # pyupgrade (New Syntax Suggestions)
]

ignore = [
	"bare-except", # Duplicate of B001
	"BLE", # Blind Except
	"docstring-in-stub",
	"line-too-long", # Duplicate of B950
	"magic-value-comparison",
	"mixed-case-variable-in-class-scope",
	"no-self-use",
	"redundant-literal-union",
	"shebang-not-first-line",
	"start-process-with-no-shell",
	"suspicious-subprocess-import",
	"too-many-arguments",
	"too-many-branches",
	"too-many-locals",
	"too-many-nested-blocks",
	"too-many-positional-arguments",
	"too-many-public-methods",
	"too-many-return-statements",
	"too-many-statements",
	"undefined-local-with-import-star-usage",
	"undefined-local-with-import-star",

	# Conflicts with ruff formatter
	"avoidable-escaped-quote",
	"bad-quotes-docstring",
	"bad-quotes-inline-string",
	"bad-quotes-multiline-string",
	"docstring-tab-indentation",
	"indentation-with-invalid-multiple-comment",
	"indentation-with-invalid-multiple",
	"line-too-long",
	"missing-trailing-comma",
	"over-indented",
	"prohibited-trailing-comma",
	"tab-indentation",
	"triple-single-quotes",
	"unnecessary-escaped-quote",
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportWildcardImportFromLibrary = false
reportMissingParameterType = false      # Redundant with Ruff ANN001
reportUndefinedVariable = false         # Redundant with Ruff F821
reportUnusedImport = false              # Redundant with Ruff F401
reportUnusedVariable = false            # Redundant with Ruff F841
