name: Build and Release

on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      upload_to_nexus:
        description: Upload to Nexus Mods
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Get version
        id: version
        shell: bash
        run: |
          v=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check version is unused
        if: github.ref_type == 'tag' || inputs.upload_to_nexus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$VERSION'"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for version '$VERSION' already exists"
            exit 1
          fi

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | awk '{ sub(/\r$/, "") } NF { started = 1; while (b-- > 0) print ""; b = 0; print; next } started { b++ }' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version '$VERSION'"
            exit 1
          fi
          cat release-notes.md

      - name: Build
        run: uv run pyinstaller --noconfirm --clean cm-toolkit.spec

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging/Tools | Out-Null
          Copy-Item dist/cm-toolkit staging/Tools/CM-Toolkit -Recurse
          Compress-Archive -Path staging/Tools -DestinationPath cm-toolkit.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cm-toolkit
          path: cm-toolkit.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cm-toolkit

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" cm-toolkit.zip \
            --repo "${{ github.repository }}" \
            --title "Collective Modding Toolkit v${{ github.ref_name }}" \
            --notes-file release-notes.md

  nexus:
    if: github.ref_type == 'tag' || inputs.upload_to_nexus
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: cm-toolkit

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Build Nexus changelog
        id: changelog
        run: |
          {
            echo "text<<EOF_CHANGELOG"
            python3 .github/scripts/nexus_changelog.py release-notes.md
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          changelog: ${{ steps.changelog.outputs.text }}
          filename: cm-toolkit.zip
          version: ${{ needs.build.outputs.version }}
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
          display_name: Collective Modding Toolkit
